<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATT&amp;CK Graph · Dashboard Executivo de CTI</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='8' cy='16' r='5' fill='%23f2555a'/%3E%3Ccircle cx='24' cy='8' r='4' fill='%23f5a524'/%3E%3Ccircle cx='24' cy='24' r='4' fill='%234c8dff'/%3E%3Cpath d='M8 16L24 8M8 16L24 24M24 8L24 24' stroke='%2394a3b8' stroke-width='1.5'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>ATT&amp;CK Graph</h1>
          <p class="subtitle">Grupo → Software → Técnica</p>
        </div>
      </div>

      <div class="controls">
        <div class="control group-picker">
          <label for="group-search">Ator de Ameaça</label>
          <div class="combo">
            <input id="group-search" type="search" placeholder="Buscar grupo (ex.: APT29, Lazarus)…" autocomplete="off" />
            <ul id="group-options" class="combo-list" role="listbox" hidden></ul>
          </div>
          <div id="group-chips" class="chips" aria-live="polite"></div>
        </div>

        <div class="control">
          <label for="tactic-filter">Tática</label>
          <select id="tactic-filter">
            <option value="">Todas as táticas</option>
          </select>
        </div>

        <div class="control toggles">
          <label class="toggle"><input id="toggle-software-tech" type="checkbox" checked /> Técnicas via software</label>
          <label class="toggle"><input id="toggle-subtech" type="checkbox" checked /> Sub-técnicas</label>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="stage" aria-label="Grafo de relacionamentos">
        <svg id="graph" role="img" aria-label="Grafo de força direcionada do MITRE ATT&amp;CK"></svg>

        <div class="legend" aria-label="Legenda">
          <span><i class="dot group"></i>Grupo</span>
          <span><i class="dot software"></i>Software</span>
          <span><i class="dot technique"></i>Técnica</span>
        </div>

        <div class="stage-tools">
          <span id="graph-stats" class="stats"></span>
          <button id="btn-reset" type="button" title="Limpar destaque e centralizar">Recentrar</button>
        </div>

        <div id="tooltip" class="tooltip" hidden></div>
        <div id="loading" class="loading">Carregando dataset do ATT&amp;CK…</div>
      </section>

      <aside id="sidebar" class="sidebar" aria-label="Detalhes do nó">
        <div id="sidebar-content"></div>
      </aside>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
